name: Set up workspace
description: Installs pnpm and Node from the versions pinned in the repository, then installs dependencies from the lockfile.

runs:
  using: composite
  steps:
    # The pnpm version comes from the packageManager field of the root package.json.
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # Git hooks are for local commits only; CI runs the same checks as explicit steps.
    - name: Install dependencies
      shell: bash
      env:
        HUSKY: '0'
      run: pnpm install --frozen-lockfile
